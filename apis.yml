name: Physiohome
description: >-
  Physiohome, operating as Ameen (رعاية أمين), is a Saudi Arabia-based, tech-enabled
  provider of home rehabilitation and physical therapy services. Founded in 2021 out of
  a Ministry of Health sector accelerator, the company delivers physiotherapy, occupational
  therapy, speech therapy, nutritional therapy, and personal training for adults and seniors
  in patients' homes and rehabilitation centers. Its platform manages the full care journey
  from assessment and treatment planning through session tracking, provider equipping, and
  reporting, with 100+ active service providers operating across nine cities and a wider
  network of 700+ providers. Ameen offers iOS and Android apps, an online booking flow, and
  a patient portal, but publishes no public developer API, documentation, or developer portal.
  It is a portfolio company of Sanabil 500 (500 Global) and Saudi Venture Capital.
